<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <title>Iniciar sesión | Drugstore System</title>

        <!--begin::Theme Init (prevents flash of incorrect theme on load, #6043)-->
        <script>
            (() => {
                'use strict';
                const root = document.documentElement;

                // Applications with their own theming opt out of AdminLTE's color mode
                // entirely, here as well as in the bundle.
                if (root.getAttribute('data-lte-color-mode') === 'off') {
                    return;
                }

                const STORAGE_KEY = 'lte-theme';
                let stored = null;
                try {
                    stored = localStorage.getItem(STORAGE_KEY);
                } catch {
                    // localStorage may be unavailable (private mode, sandboxed iframe).
                }
                // Mirror the precedence in color-mode.ts: the visitor's stored choice
                // wins, then a theme this page declared itself, then the OS preference.
                const authored = root.getAttribute('data-bs-theme');
                let resolved = 'light';
                if (stored === 'dark' || stored === 'light') {
                    resolved = stored;
                } else if (authored === 'dark' || authored === 'light') {
                    resolved = authored;
                } else if (globalThis.matchMedia('(prefers-color-scheme: dark)').matches) {
                    resolved = 'dark';
                }
                root.setAttribute('data-bs-theme', resolved);
                root.style.colorScheme = resolved;
                // Flag values computed here, so the bundle does not mistake them for a
                // theme the page declared and stop following the OS preference.
                if (resolved !== authored) {
                    root.setAttribute('data-lte-theme-resolved', '');
                }
            })();
        </script>
        <!--end::Theme Init-->

        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#007bff" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />

        <meta name="title" content="AdminLTE 4 | Login Page" />
        <meta name="author" content="ColorlibHQ" />
        <meta name="description" content="AdminLTE is a free Bootstrap 5 admin dashboard template with almost 50 example pages, built with vanilla JS and designed with accessibility in mind."/>
        <meta name="keywords" content="bootstrap 5, bootstrap, bootstrap 5 admin dashboard, bootstrap 5 dashboard, bootstrap 5 charts, bootstrap 5 calendar, bootstrap 5 datepicker, bootstrap 5 tables, bootstrap 5 datatable, vanilla js datatable, colorlibhq, colorlibhq dashboard, colorlibhq admin dashboard, accessible admin panel"/>

        <meta name="supported-color-schemes" content="light dark" />
        <link rel="preload" href="../adminlte/css/adminlte.css" as="style" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.3.0/index.css" integrity="sha256-5UwXtC6TaPHCAbVQ59waEAqOssHyhn/twyuLRRWszzo=" crossorigin="anonymous" media="print" onload="this.media = 'all'"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.16.0/styles/overlayscrollbars.min.css" crossorigin="anonymous"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous"/>
        <link rel="stylesheet" href="../adminlte/css/adminlte.css" />
    </head>

    <body class="login-page bg-body-secondary">
        <main class="login-box">
            <h1 class="login-logo">
                <a href="/login"><b>FarmaPlus</b></a>
            </h1>
            <!-- /.login-logo -->
            <div class="card">
                <div class="card-body login-card-body">
                    <p class="login-box-msg">Sign in to start your session</p>

                    <!-- Mensaje de error -->
                    <div th:if="${param.error}"
                         class="alert alert-danger alert-dismissible fade show"
                         role="alert">
                        Usuario o contraseña incorrectos.
                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert"
                                aria-label="Cerrar"></button>
                    </div>
                    <!-- Mensaje de logout -->
                    <div th:if="${param.logout}"
                         class="alert alert-success alert-dismissible fade show"
                         role="alert">
                        Has cerrado sesión correctamente.
                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert"
                                aria-label="Cerrar"></button>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="input-group mb-3">
                            <input
                                    type="text"
                                    name="username"
                                    class="form-control"
                                    placeholder="Username"
                                    autocomplete="username"
                                    required
                            />
                            <div class="input-group-text">
                                <span class="bi bi-envelope"></span>
                            </div>
                        </div>

                        <div class="input-group mb-3">
                            <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Password"
                                    autocomplete="current-password"
                                    required
                            />
                            <div class="input-group-text">
                                <span class="bi bi-lock-fill"></span>
                            </div>
                        </div>
                        <!--begin::Row-->
                        <div class="row">
                            <div class="col-8">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault" />
                                    <label class="form-check-label" for="flexCheckDefault"> Remember Me </label>
                                </div>
                            </div>
                            <!-- /.col -->
                            <div class="col-4">
                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-primary">Sign In</button>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>
                        <!--end::Row-->
                    </form>

                    <p class="mb-1">
                        <a href="forgot-password.html">Olvidé mi contraseña</a>
                    </p>
                    <p class="mb-0">
                        <a href="register.html" class="text-center"> Registrar una nueva membresía </a>
                    </p>
                </div>
                <!-- /.login-card-body -->
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.16.0/browser/overlayscrollbars.browser.es6.min.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
        <script src="../adminlte/js/adminlte.js"></script>

        <!--begin::OverlayScrollbars Configure-->
        <script>
            const SELECTOR_SIDEBAR_WRAPPER = '.sidebar-wrapper';
            const Default = {
                scrollbarTheme: 'os-theme-light',
                scrollbarAutoHide: 'leave',
                scrollbarClickScroll: true,
            };
            document.addEventListener('DOMContentLoaded', function () {
                const sidebarWrapper = document.querySelector(SELECTOR_SIDEBAR_WRAPPER);

                // Disable OverlayScrollbars on mobile devices to prevent touch interference
                const isMobile = window.innerWidth <= 992;

                if (
                    sidebarWrapper &&
                    globalThis.OverlayScrollbarsGlobal?.OverlayScrollbars !== undefined &&
                    !isMobile
                ) {
                    OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
                        scrollbars: {
                            theme: Default.scrollbarTheme,
                            autoHide: Default.scrollbarAutoHide,
                            clickScroll: Default.scrollbarClickScroll,
                        },
                    });
                }
            });
        </script>
    </body>
</html>
