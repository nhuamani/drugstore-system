<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">

    <head>
        <title>Cambiar contraseña</title>
    </head>

    <main layout:fragment="main">

        <div class="app-content-header">
            <div class="container-fluid">
                <h3 class="mb-0">Cambiar contraseña</h3>
            </div>
        </div>

        <div class="app-content">
            <div class="container-fluid">

                <div class="row">
                    <div class="col-md-8 col-lg-6">

                        <div class="card card-primary card-outline">

                            <div class="card-header">
                                <h3 class="card-title">
                                    <i class="bi bi-shield-lock me-2"></i>
                                    Restablecer contraseña
                                </h3>
                            </div>

                            <form th:action="@{/users/{id}/password(id=${userId})}"
                                  th:object="${passwordChangeDTO}"
                                  method="post">

                                <div class="card-body">

                                    <p>
                                        Usuario:
                                        <strong th:text="${username}">usuario</strong>
                                    </p>

                                    <div class="alert alert-info">
                                        Introduce la nueva contraseña para esta cuenta.
                                    </div>

                                    <div class="mb-3">
                                        <label for="password" class="form-label">
                                            Nueva contraseña
                                        </label>

                                        <input type="password"
                                               id="password"
                                               th:field="*{password}"
                                               class="form-control"
                                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                               minlength="8"
                                               maxlength="72"
                                               autocomplete="new-password"
                                               required>

                                        <div class="invalid-feedback"
                                             th:if="${#fields.hasErrors('password')}"
                                             th:errors="*{password}">
                                        </div>

                                        <div class="form-text">
                                            Debe contener entre 8 y 72 caracteres.
                                        </div>
                                    </div>

                                </div>

                                <div class="card-footer d-flex justify-content-between">

                                    <a th:href="@{/users}"
                                       class="btn btn-secondary">
                                        <i class="bi bi-arrow-left me-1"></i>
                                        Cancelar
                                    </a>

                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-key me-1"></i>
                                        Actualizar contraseña
                                    </button>

                                </div>

                            </form>

                        </div>

                    </div>
                </div>

            </div>
        </div>

    </main>

</html>
